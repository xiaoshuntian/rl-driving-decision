# SAC baseline on highway-env's continuous-action variant
experiment:
  name: sac_highway_continuous
  seed: 42
  output_dir: runs/sac_highway_continuous

env:
  id: highway-v0
  n_envs: 1
  config:
    lanes_count: 4
    vehicles_count: 50
    duration: 40
    collision_reward: -1.0
    right_lane_reward: 0.1
    high_speed_reward: 0.4
    reward_speed_range: [20, 30]
    normalize_reward: true
    observation:
      type: Kinematics
      vehicles_count: 5
      features: [presence, x, y, vx, vy]
      absolute: false
      order: sorted
    action:
      type: ContinuousAction

algo:
  policy: MlpPolicy
  learning_rate: 3.0e-4
  buffer_size: 100000
  batch_size: 256
  tau: 0.005
  gamma: 0.95
  train_freq: 1
  gradient_steps: 1
  ent_coef: auto
  verbose: 1

train:
  total_timesteps: 200000
  eval_freq: 10000
  n_eval_episodes: 10
  save_freq: 50000
