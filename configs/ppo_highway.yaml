# PPO baseline on highway-env highway-fast-v0
experiment:
  name: ppo_highway_fast
  seed: 42
  output_dir: runs/ppo_highway_fast

env:
  id: highway-fast-v0
  n_envs: 4
  config:
    lanes_count: 4
    vehicles_count: 50
    duration: 40
    collision_reward: -1.0
    right_lane_reward: 0.1
    high_speed_reward: 0.4
    reward_speed_range: [20, 30]
    normalize_reward: true
    observation:
      type: Kinematics
      vehicles_count: 5
      features: [presence, x, y, vx, vy]
      absolute: false
      order: sorted
    action:
      type: DiscreteMetaAction

algo:
  policy: MlpPolicy
  learning_rate: 5.0e-4
  n_steps: 512
  batch_size: 64
  n_epochs: 10
  gamma: 0.95
  gae_lambda: 0.95
  ent_coef: 0.01
  clip_range: 0.2
  verbose: 1

train:
  total_timesteps: 200000
  eval_freq: 10000
  n_eval_episodes: 10
  save_freq: 50000
